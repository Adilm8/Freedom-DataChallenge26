<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CQA · Качество оценки</title>
  <link rel="stylesheet" href="../css/cqa.css">
  <style>html, body { margin: 0; background: #f4f5f9; }</style>
</head>
<body>
  <div id="cqa-host" class="cqa-root"></div>
  <script type="module">
    import { mount } from '../js/components/quality-view.js';
    import { paramsFromQuery } from '../js/ui.js';
    const q = paramsFromQuery();
    const el = document.getElementById('cqa-host');
    if (q.demo === '1') el.classList.add('cqa-demo');
    if (q.theme === 'dark') el.dataset.theme = 'dark';
    mount(el, { runs: q.runs });
  </script>
</body>
</html>
