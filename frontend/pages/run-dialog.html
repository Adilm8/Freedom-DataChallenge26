<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CQA · Запуск оценки</title>
  <link rel="stylesheet" href="../css/cqa.css">
  <style>html, body { margin: 0; background: #f4f5f9; } #cqa-host { padding: 16px; }</style>
</head>
<body>
  <!-- Встроенный запуск оценки: ?ids=1,2,3 (диалоги) или ?group=DEV (вся группа), ?version=<id> — версия чек-листа. -->
  <div id="cqa-host" class="cqa-root"></div>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module">
    import { mount } from '../js/components/run-dialog.js';
    import { paramsFromQuery } from '../js/ui.js';
    const q = paramsFromQuery();
    const el = document.getElementById('cqa-host');
    if (q.demo === '1') el.classList.add('cqa-demo');
    mount(el, { group: q.group || 'DEV', ids: q.ids || '', version: q.version });
  </script>
</body>
</html>
