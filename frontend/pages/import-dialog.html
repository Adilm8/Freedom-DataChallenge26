<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CQA · Импорт набора</title>
  <link rel="stylesheet" href="../css/cqa.css">
  <style>html, body { margin: 0; background: #f4f5f9; } html:has(.cqa-root[data-theme="dark"]), html:has(.cqa-root[data-theme="dark"]) body { background: #0f1218; } #cqa-host { padding: 16px; }</style>
</head>
<body>
  <!-- Импорт набора: ?group=<group_id> — значение поля, ?method=file — сразу загрузка файла; ?theme=dark, ?demo=1, ?mock=1. -->
  <div id="cqa-host" class="cqa-root"></div>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module">
    import { mount } from '../js/components/import-dialog.js';
    import { openRunDialog } from '../js/components/run-dialog.js';
    import { paramsFromQuery } from '../js/ui.js';
    const q = paramsFromQuery();
    const el = document.getElementById('cqa-host');
    if (q.demo === '1') el.classList.add('cqa-demo');
    if (q.theme === 'dark') el.dataset.theme = 'dark';
    // «Открыть группу»: переходим в оболочку к списку этой группы (оболочка берёт группу из сохранённых настроек).
    el.addEventListener('cqa:groups-changed', (e) => {
      if (!e.detail?.select) return;
      try { localStorage.setItem('cqa.group', e.detail.select); } catch { /* недоступно */ }
      location.href = '../index.html' + location.search + (e.detail.to || '#/conversations');
    });
    // «Оценить группу»: то же окно запуска, что в оболочке.
    el.addEventListener('cqa:run-request', (e) => openRunDialog(el, { ...e.detail }));
    mount(el, { group: q.group || '', method: q.method });
  </script>
</body>
</html>
