<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CQA · Апелляции</title>
  <link rel="stylesheet" href="../css/cqa.css">
  <style>html, body { margin: 0; background: #f4f5f9; }</style>
</head>
<body>
  <!-- Очередь апелляций и решение: ?group=DEV&mode=reviewer|analyst&status=open|closed|changed|confirmed|all&id=<апелляция> -->
  <div id="cqa-host" class="cqa-root"></div>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module">
    import { mount } from '../js/components/appeal-review.js';
    import { paramsFromQuery } from '../js/ui.js';
    const q = paramsFromQuery();
    const el = document.getElementById('cqa-host');
    if (q.demo === '1') el.classList.add('cqa-demo');
    // Навигация между экранами: в автономной странице переходим в оболочку.
    el.addEventListener('cqa:navigate', (e) => { location.href = '../index.html' + location.search + e.detail.to; });
    el.addEventListener('cqa:mode', (e) => { const u = new URLSearchParams(location.search); u.set('mode', e.detail.mode); location.search = u; });
    mount(el, { group: q.group || 'DEV', mode: q.mode || 'reviewer', status: q.status, id: q.id });
  </script>
</body>
</html>
