# docker compose up --build  →  http://localhost:8000
services:
  cqa:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/var/cqa.db   # перекрывает путь из .env
    volumes:
      - cqa-db:/app/var             # БД переживает перезапуск
      - cqa-raw:/app/data/raw       # скачанные наборы
      - ./results:/app/results      # results.json сдачи — на хосте
volumes:
  cqa-db:
  cqa-raw:
